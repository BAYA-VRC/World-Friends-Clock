<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌎せかいトモダチどけい🕒</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌎</text></svg>">
    
    <style>
        :root {
            /* Design Parameters */
            --ring-diameter: 620px;
            --ring-thickness: 40px;
            --tag-start-radius: 390px;
            --tag-distance: 116px;
            --tag-font-size: 15px;
            --earth-size: 350px;
            --earth-y-offset: -25px;
            --accent-color: #38bdf8;
            /* Scale Correction for Flat Earth Mode */
            --global-scale-y: 1.0;
            --text-scale-y: 1.0;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', 'Meiryo', sans-serif; 
            background-color: #000000; color: white;
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* ⚙ DisplaySetting Panel */
        #menuToggle {
            position: fixed; top: 20px; left: 20px; z-index: 2000;
            background: rgba(15, 23, 42, 0.9); border: 1px solid var(--accent-color);
            color: white; padding: 10px 15px; border-radius: 8px; cursor: pointer;
            font-weight: bold; backdrop-filter: blur(10px);
        }
        #adjustPanel {
            position: fixed; top: 70px; left: -400px; width: 380px;
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 0 15px 15px 0; z-index: 1500; padding: 20px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #adjustPanel.open { left: 0; }

        /* Clock Visual Area */
        .main-content {
            flex: 1; width: 100%; position: relative; min-height: 800px;
            display: flex; justify-content: center; align-items: center;
        }

        .clock-unit-wrapper {
            position: relative;
            transform: scaleY(var(--global-scale-y));
            transition: transform 0.5s ease-in-out;
        }

        .clock-center { position: relative; }

        .ring-clock {
            position: absolute; border-radius: 50%;
            width: var(--ring-diameter); height: var(--ring-diameter);
            background: conic-gradient(
                from 0deg,
                #38bdf8 0% 12.5%,
                #f97316 20.8% 29.1%,
                #0f172a 37.5% 62.5%,
                #f97316 70.8% 79.1%,
                #38bdf8 87.5% 100%
            );
            mask: radial-gradient(circle, transparent calc(var(--ring-diameter) / 2 - var(--ring-thickness)), black calc(var(--ring-diameter) / 2 - var(--ring-thickness) + 0.5px));
            -webkit-mask: radial-gradient(circle, transparent calc(var(--ring-diameter) / 2 - var(--ring-thickness)), black calc(var(--ring-diameter) / 2 - var(--ring-thickness) + 0.5px));
            transform: translate(-50%, -50%);
        }

        .earth-container {
            position: absolute; top: var(--earth-y-offset); left: 0;
            transform: translate(-50%, -50%);
            width: var(--earth-size); height: var(--earth-size);
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }
        .earth-icon { font-size: var(--earth-size); line-height: 1; }

        /* Text Elements with Anti-distortion */
        .hour-tick { 
            position: absolute; font-weight: 800; color: #fff; 
            z-index: 20; transform: translate(-50%, -50%) scaleY(var(--text-scale-y));
            pointer-events: none; text-shadow: 2px 2px 4px #000; font-size: 13px;
            transition: transform 0.5s ease-in-out;
        }

        .friend-tag { 
            position: absolute; font-weight: bold; 
            padding: 0; border: none; background: none; 
            white-space: nowrap; z-index: 100; 
            transform: translate(0, -50%) scaleY(var(--text-scale-y));
            display: flex; flex-direction: column; align-items: flex-start;
            text-shadow: 2px 2px 5px rgba(0,0,0,1);
            font-size: var(--tag-font-size);
            transition: transform 0.5s ease-in-out;
        }
        .tag-name { line-height: 1.2; }
        .tag-time { color: var(--accent-color); font-weight: 900; margin-top: 1px; }

        /* Form Controls */
        .switch-group { display: flex; background: #000; border-radius: 8px; border: 1px solid #444; overflow: hidden; margin-top: 5px; }
        .switch-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #666; cursor: pointer; font-size: 0.8em; font-weight: bold; transition: 0.2s; }
        .switch-btn.active { background: var(--accent-color); color: #000; }

        /* Data Management Window */
        .bottom-window { width: 95%; max-width: 1100px; background: rgba(15, 23, 42, 0.95); padding: 30px; border-radius: 25px 25px 0 0; border: 1px solid rgba(255,255,255,0.1); margin-top: 50px; z-index: 100; }
        .section-label { font-size: 0.75em; color: var(--accent-color); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; display: block; }
        .form-row { display: flex; gap: 10px; margin-bottom: 25px; align-items: flex-end; flex-wrap: wrap; }
        .search-container { flex: 2; display: flex; flex-direction: column; gap: 5px; min-width: 220px; }
        .search-filter { padding: 8px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; font-size: 0.8em; }
        select, input[type="text"] { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #0a0a0a; color: white; width: 100%; }
        .add-btn { background: var(--accent-color); color: black; font-weight: 800; border: none; cursor: pointer; border-radius: 8px; height: 43px; padding: 0 25px; }

        /* Simplified List Item */
        .list-item { display: flex; gap: 15px; margin-bottom: 10px; align-items: center; background: rgba(255,255,255,0.03); padding: 12px 20px; border-radius: 10px; }
        .info-pill { display: flex; flex-direction: column; min-width: 150px; }
        .tz-display { font-size: 0.7em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .time-group { display: flex; gap: 8px; align-items: center; }
        .diff-tag { background: #1e293b; padding: 2px 8px; border-radius: 4px; font-size: 0.8em; color: var(--accent-color); font-weight: 900; }
        .time-tag { font-family: 'Courier New', monospace; font-weight: 900; font-size: 0.9em; }

        .sld-row { margin-bottom: 18px; }
        .sld-controls { display: flex; gap: 12px; align-items: center; }
        .num-input { width: 80px; background: #000; color: var(--accent-color); border: 1px solid #444; border-radius: 5px; text-align: center; font-weight: bold; }
        .footer { margin: 40px 0; font-size: 0.8em; color: #444; font-weight: bold; text-align: center; }
        .ko-fi-btn { display: inline-block; background: #29abe0; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9em; margin-top: 10px; transition: 0.3s; }
        .ko-fi-btn:hover { background: #1e86b3; }
    </style>
</head>
<body>

    <button id="menuToggle" onclick="toggleMenu()">⚙ DisplaySetting</button>
    <div id="adjustPanel">
        <h4 style="margin:0 0 20px 0; color:var(--accent-color);">Visual Configuration</h4>
        <div id="sliderContainer"></div>
        <div style="margin-top:20px;">
            <span class="section-label">Shape Options</span>
            <div class="switch-group">
                <button id="btnBall" class="switch-btn active" onclick="setShape('ball')">🍎Ball Earth</button>
                <button id="btnFlat" class="switch-btn" onclick="setShape('flat')">🍕Flat Earth</button>
            </div>
        </div>
        <div style="margin-top:20px;">
            <span class="section-label">Time Format</span>
            <select id="timeFormatSelect" onchange="refreshAll()" style="background:#000; color:white;">
                <option value="24h">24-hour</option>
                <option value="12h">12-hour (AM/PM)</option>
            </select>
        </div>
        
        <div style="margin-top:30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <span class="section-label">Support Developer</span>
            <a href="https://ko-fi.com/baya_vrc" target="_blank" class="ko-fi-btn">
                ☕ Buy me a coffee (Ko-fi)
            </a>
        </div>
    </div>

    <h1>🌎せかいトモダチどけい🕒</h1>

    <div class="main-content">
        <div class="clock-unit-wrapper" id="globalUnit">
            <div class="clock-center" id="clockCenter">
                <div class="ring-clock"></div>
                <div class="earth-container"><span class="earth-icon" id="earthIcon">🌏</span></div>
            </div>
        </div>
    </div>

    <div class="bottom-window">
        <h3 style="margin-top:0;">DATA MANAGEMENT</h3>
        <span class="section-label">Your Setting</span>
        <div class="form-row">
            <div class="search-container">
                <input type="text" class="search-filter" placeholder="Search Timezone..." oninput="filterTzList('myTz', this.value)">
                <select id="myTz" onchange="updateMyTz()"></select>
            </div>
        </div>

        <span class="section-label">New Registration</span>
        <div class="form-row">
            <input type="text" id="addName" placeholder="Name" style="flex:1;">
            <div class="search-container">
                <input type="text" class="search-filter" placeholder="Search Timezone..." oninput="filterTzList('addTz', this.value)">
                <select id="addTz"></select>
            </div>
            <button class="add-btn" onclick="addNewFriend()">Add Friend</button>
        </div>

        <div id="friendList"></div>
    </div>

    <div class="footer">
        Created by: BAYA | 
        <a href="https://ko-fi.com/baya_vrc" target="_blank" style="color: #ff5f5f; text-decoration: none; font-weight: bold; border-bottom: 1px dashed #ff5f5f;">
            ☕ Support me on Ko-fi
        </a>
    </div>

    <script>
        const CONFIG = {
            CLOCK_RING_DIAMETER: 620,
            CLOCK_RING_THICKNESS: 40,
            FRIEND_TAG_START_RADIUS: 390,
            FRIEND_TAG_DISTANCE: 116,
            FRIEND_TAG_FONT_SIZE: 15,
            EARTH_ICON_SIZE: 350,
            EARTH_Y_OFFSET: -25,
            ACCENT_COLOR: "#38bdf8",
            SHAPE: "ball"
        };

        const allTimezones = Intl.supportedValuesOf('timeZone');
        let friends = JSON.parse(localStorage.getItem('vrc_f_v2.2')) || [
            { id: 1, name: "🐱Catty", tz: "America/Denver" },
            { id: 2, name: "🧙‍♀️Jim", tz: "America/Denver" },
            { id: 3, name: "🧚Tiana", tz: "America/Los_Angeles" },
            { id: 4, name: "🐺Wolf World", tz: "America/Los_Angeles" },
            { id: 5, name: "📷あきうみ", tz: "Asia/Tokyo" },
            { id: 6, name: "🩹BAYA", tz: "Asia/Tokyo" },
            { id: 7, name: "🐇Hanny", tz: "Europe/Berlin" },
            { id: 8, name: "🧴Suitou-Bottole", tz: "Asia/Hebron" },
            { id: 9, name: "🥟Gyoza", tz: "Asia/Taipei" }
        ];
        let myTz = localStorage.getItem('vrc_my_tz_v2.2') || 'Asia/Tokyo';

        function toggleMenu() { document.getElementById('adjustPanel').classList.toggle('open'); }

        function initSliders() {
            const container = document.getElementById('sliderContainer');
            const defs = [
                { k: 'CLOCK_RING_DIAMETER', l: 'RING DIAMETER', min: 200, max: 1200 },
                { k: 'FRIEND_TAG_START_RADIUS', l: 'TAG RADIUS', min: 50, max: 800 },
                { k: 'FRIEND_TAG_FONT_SIZE', l: 'TAG FONT SIZE', min: 8, max: 40 },
                { k: 'EARTH_ICON_SIZE', l: 'EARTH SIZE', min: 50, max: 800 },
                { k: 'EARTH_Y_OFFSET', l: 'EARTH OFFSET', min: -300, max: 300 }
            ];
            defs.forEach(d => {
                const row = document.createElement('div'); row.className = 'sld-row';
                row.innerHTML = `<span class="section-label">${d.l}</span><div class="sld-controls">
                    <input type="range" min="${d.min}" max="${d.max}" value="${CONFIG[d.k]}" oninput="syncP('${d.k}', this.value, 'num_${d.k}')" id="sld_${d.k}">
                    <input type="number" id="num_${d.k}" class="num-input" value="${CONFIG[d.k]}" oninput="syncP('${d.k}', this.value, 'sld_${d.k}')"></div>`;
                container.appendChild(row);
            });
            updateVisuals();
        }

        function syncP(k, v, otherId) {
            CONFIG[k] = parseInt(v) || 0; document.getElementById(otherId).value = v;
            updateVisuals(); if(k === 'CLOCK_RING_DIAMETER') renderTicks(); refreshTags();
        }

        function setShape(shape) {
            CONFIG.SHAPE = shape;
            document.getElementById('btnBall').classList.toggle('active', shape === 'ball');
            document.getElementById('btnFlat').classList.toggle('active', shape === 'flat');
            updateVisuals();
        }

        function updateVisuals() {
            const r = document.documentElement;
            const isFlat = CONFIG.SHAPE === 'flat';
            r.style.setProperty('--ring-diameter', CONFIG.CLOCK_RING_DIAMETER + 'px');
            r.style.setProperty('--tag-font-size', CONFIG.FRIEND_TAG_FONT_SIZE + 'px');
            r.style.setProperty('--earth-size', CONFIG.EARTH_ICON_SIZE + 'px');
            r.style.setProperty('--earth-y-offset', CONFIG.EARTH_Y_OFFSET + 'px');
            r.style.setProperty('--global-scale-y', isFlat ? '0.6' : '1.0');
            r.style.setProperty('--text-scale-y', isFlat ? '1.666' : '1.0');
        }

        function filterTzList(selectId, query) {
            const select = document.getElementById(selectId);
            const current = select.value; select.innerHTML = '';
            allTimezones.filter(tz => tz.toLowerCase().includes(query.toLowerCase())).forEach(tz => {
                const opt = new Option(tz, tz); if(tz === current) opt.selected = true; select.appendChild(opt);
            });
        }

        function getInfo(tz) {
            const now = new Date();
            const use12 = document.getElementById('timeFormatSelect').value === '12h';
            const time = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: use12 }).format(now);
            const diff = Math.round((new Date(now.toLocaleString('en-US', {timeZone: tz})) - new Date(now.toLocaleString('en-US', {timeZone: myTz}))) / 3600000);
            return { time, diff: (diff >= 0 ? '+' : '') + diff + 'h' };
        }

        function renderTicks() {
            document.querySelectorAll('.hour-tick').forEach(e => e.remove());
            const center = document.getElementById('clockCenter');
            const use12 = document.getElementById('timeFormatSelect').value === '12h';
            for(let i=0; i<24; i++) {
                const t = document.createElement('div'); t.className = 'hour-tick';
                const angle = (i - 12) * 15;
                const rad = (CONFIG.CLOCK_RING_DIAMETER / 2) - (CONFIG.CLOCK_RING_THICKNESS / 2);
                t.style.left = (Math.cos((angle - 90) * Math.PI / 180) * rad) + 'px';
                t.style.top = (Math.sin((angle - 90) * Math.PI / 180) * rad) + 'px';
                if (use12) {
                    if (i === 0) t.innerText = "12 AM"; else if (i === 12) t.innerText = "12 PM";
                    else if (i > 12) t.innerText = (i - 12) + " PM"; else t.innerText = i + " AM";
                } else t.innerText = i;
                center.appendChild(t);
            }
        }

        function refreshTags() {
            document.querySelectorAll('.friend-tag').forEach(e => e.remove());
            const groups = {};
            friends.forEach(f => {
                if(!groups[f.tz]) groups[f.tz] = { names: [], tz: f.tz };
                groups[f.tz].names.push(f.name);
            });

            const angleStack = {};
            Object.values(groups).forEach(g => {
                const info = getInfo(g.tz);
                const now = new Date();
                const p = new Intl.DateTimeFormat('en-US', { timeZone: g.tz, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(now);
                const angle = (parseInt(p.find(x=>x.type==='hour').value) + parseInt(p.find(x=>x.type==='minute').value)/60 - 12) * 15;
                const key = Math.round(angle);
                angleStack[key] = (angleStack[key] || 0) + 1;

                const dist = CONFIG.FRIEND_TAG_START_RADIUS + ((angleStack[key]-1) * CONFIG.FRIEND_TAG_DISTANCE);
                const tag = document.createElement('div'); tag.className = 'friend-tag';
                tag.style.left = (Math.cos((angle - 90) * Math.PI / 180) * dist) + 'px';
                tag.style.top = (Math.sin((angle - 90) * Math.PI / 180) * dist) + 'px';
                tag.innerHTML = g.names.map(n => `<div class="tag-name">${n}</div>`).join('') + `<div class="tag-time">${info.time}</div>`;
                document.getElementById('clockCenter').appendChild(tag);
            });
        }

        function refreshList() {
            const container = document.getElementById('friendList'); container.innerHTML = '';
            friends.forEach((f, i) => {
                const info = getInfo(f.tz);
                const div = document.createElement('div'); div.className = 'list-item';
                div.draggable = true;
                div.innerHTML = `<span style="cursor:move; opacity:0.3; padding-right:10px;">☰</span>
                    <div class="info-pill">
                        <div class="time-group">
                            <div class="diff-tag">${info.diff}</div>
                            <div class="time-tag" style="font-family: 'Courier New', monospace; font-weight: 900; font-size: 0.9em;">${info.time}</div>
                        </div>
                        <div class="tz-display">${f.tz}</div>
                    </div>
                    <input type="text" value="${f.name}" oninput="editF(${f.id}, 'name', this.value)" style="flex:1; border:none; background:rgba(255,255,255,0.05); color:white; padding: 10px; border-radius: 5px;">
                    <button onclick="delF(${f.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold; font-size:1.4em; padding-left:15px;">×</button>`;
                div.ondragstart = (e) => e.dataTransfer.setData('text', i);
                div.ondragover = (e) => e.preventDefault();
                div.ondrop = (e) => {
                    const from = e.dataTransfer.getData('text');
                    const item = friends.splice(from, 1)[0];
                    friends.splice(i, 0, item); save();
                };
                container.appendChild(div);
            });
        }

        function refreshAll() { renderTicks(); refreshTags(); refreshList(); }
        function updateMyTz() { myTz = document.getElementById('myTz').value; localStorage.setItem('vrc_my_tz_v2.2', myTz); refreshAll(); }
        function addNewFriend() {
            const name = document.getElementById('addName').value; const tz = document.getElementById('addTz').value;
            if(!name) return; friends.push({ id: Date.now(), name, tz }); save(); document.getElementById('addName').value = '';
        }
        function editF(id, field, val) { const f = friends.find(x => x.id == id); if(f) { f[field] = val; save(false); } }
        function delF(id) { friends = friends.filter(x => x.id !== id); save(); }
        function save(re = true) {
            localStorage.setItem('vrc_f_v2.2', JSON.stringify(friends));
            if(re) refreshList(); refreshTags();
        }

        function init() {
            filterTzList('myTz', ''); filterTzList('addTz', '');
            document.getElementById('myTz').value = myTz;
            initSliders(); refreshAll(); setInterval(refreshTags, 1000);
        }
        init();
    </script>
</body>
</html>
